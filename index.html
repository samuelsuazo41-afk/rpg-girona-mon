<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RPG Món de Girona</title>
<meta name="description" content="RPG Girona - Força Vella 2000 anys, Temps de Flors 1954, Call 888-1492, Sant Narcís 1285">
<meta name="theme-color" content="#FF6A00">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <h1 id="app-titol">RPG Món de Girona</h1>
  <div id="totem-display"></div>
</header>
<div class="stats-bar">
  <div class="stat-item"><span id="coins">🪙 0</span> <span id="text-monedes">Monedes</span></div>
  <div class="stat-item" id="stats">Seny: 0 | Rauxa: 0 | Arrel: 0 | Obert: 0</div>
</div>
<div class="container">
  <div id="tab-mapa" class="tab-content active">
    <h2 id="text-mon">🗺️ Mapa de Girona - 2000 anys</h2>
    <div id="mapa"></div>
  </div>
  <div id="tab-missio" class="tab-content">
    <div id="missio-card">
      <h3 id="missio-titol">Selecciona missió a Girona</h3>
      <div id="npc-box" style="display:none;">
        <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom:12px;">
          <span id="npc-emoji" style="font-size:42px; line-height:1;"></span>
          <div style="flex:1;">
            <strong id="npc-nom" style="font-size:16px; display:block; margin-bottom:4px;"></strong>
            <p id="npc-dialog" style="margin:0; line-height:1.4;"></p>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:15px; padding-top:12px; border-top:1px solid #333; opacity:0.8;">
          <span id="jugador-emoji" style="font-size:32px;"></span>
          <span id="jugador-nom" style="font-size:14px; color:#aaa;"></span>
        </div>
      </div>
      <div id="missio-escenari"></div>
      <div id="missio-opcions"></div>
      <div id="missio-feedback"></div>
    </div>
  </div>
  <div id="tab-gremi" class="tab-content">
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="mostrarGremi('personatges', event)">Personatges</button>
      <button class="sub-tab-btn" onclick="mostrarGremi('llegendes', event)">📜 Llegendes</button>
      <button class="sub-tab-btn" onclick="mostrarGremi('biblioteca', event)">📚 Biblioteca</button>
      <button class="sub-tab-btn" onclick="mostrarGremi('objectes', event)">Objectes</button>
    </div>
    <div class="sub-tabs" id="biblioteca-subtabs" style="display:none;">
      <button class="sub-tab-btn active" onclick="mostrarBibliotecaTab('diccionari', event)">📖 Diccionari</button>
      <button class="sub-tab-btn" onclick="mostrarBibliotecaTab('minijocs', event)">🎮 Mini-jocs</button>
    </div>
    <div id="gremi-contenidor"></div>
  </div>
  <div id="tab-botiga" class="tab-content">
    <h2 id="text-botiga">🛒 Botiga del Barri Vell</h2>
    <div id="botiga-contenidor"></div>
  </div>
</div>
<nav class="bottom-nav">
  <div class="nav-item active" onclick="canviarTab('mapa', event)"><span class="nav-icon">🏛️</span><span id="tab-mapa-txt">Món Girona</span></div>
  <div class="nav-item" onclick="canviarTab('missio', event)"><span class="nav-icon">🌸</span><span id="tab-missio-txt">Missió</span></div>
  <div class="nav-item" onclick="canviarTab('gremi', event)"><span class="nav-icon">🦁</span><span id="tab-gremi-txt">Gremi</span></div>
  <div class="nav-item" onclick="canviarTab('botiga', event)"><span class="nav-icon">🛒</span><span id="tab-botiga-txt">Botiga</span></div>
</nav>
<div id="modal" class="modal hidden"><div class="modal-content"><p id="modalText"></p><div class="modal-botons"><button onclick="tancarModal()">Cancel·lar</button><button onclick="confirmarAccio()">Acceptar</button></div></div></div>
<div id="intro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; color:white; text-align:center; padding:20px;"><div style="font-size:80px;">🏛️</div><h2>RPG Món de Girona</h2><p>2000 anys d'història real</p><small>Toca per començar</small></div>
<script src="./main.js"></script>
<script>
const TUTORIAL_SLIDES=[
{titol:"Benvingut al Món de Girona",text:"2000 anys d'història real - 4 barris, 4 llegendes, 4 rutes secretes",emoji:"🏛️"},
{titol:"Força Vella 77aC",text:"Oppidum romà 6 Ha, 1352m muralla - 2x 100% desbloqueja Llegenda",emoji:"🏛️"},
{titol:"Temps de Flors 1954 i Call 888",text:"Maria Cobarsí, 146 muntatges, Call 800 persones, micvé 1435 trobat 2014",emoji:"🌸"},
{titol:"Sant Narcís 1285",text:"20.000 soldats morts per mosques - 3x 100% desbloqueja Ruta Secreta",emoji:"🪰"}
];
let slideActual=0;
function iniciarTutorial(){if(localStorage.getItem('girona_v1'))return;mostrarSlide(0);document.getElementById('tutorialModal').classList.remove('hidden');}
function mostrarSlide(n){slideActual=n;const s=TUTORIAL_SLIDES[n];document.getElementById('tutorialSlide').innerHTML=`<div style="font-size:64px">${s.emoji}</div><h3>${s.titol}</h3><p>${s.text}</p>`;document.getElementById('btnNextTutorial').textContent=n===3?'Començar':'Següent';}
function seguentTutorial(){if(slideActual<3)mostrarSlide(slideActual+1);else tancarTutorial();}
function tancarTutorial(){document.getElementById('tutorialModal').classList.add('hidden');localStorage.setItem('girona_v1','true');}
document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{const m=document.getElementById('tutorialModal'); if(m) { m.classList.remove('hidden'); mostrarSlide(0);} },500));
</script>
<div id="tutorialModal" class="modal hidden"><div class="modal-content"><div id="tutorialSlide"></div><div style="display:flex;justify-content:space-between;margin-top:20px;"><button class="btn btn-sec" onclick="tancarTutorial()">Saltar</button><button class="btn" id="btnNextTutorial" onclick="seguentTutorial()">Següent</button></div></div></div>
</body>
</html>
